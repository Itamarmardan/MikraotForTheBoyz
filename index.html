<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מקראות ישראל – בחינה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>מקראות ישראל – בחינה</h1>
  <p>בנק שאלות אינטראקטיבי לקצונה · בה"ד 1</p>
</header>

<div id="chapter-bar">
  <div class="bar-group">
    <span class="bar-label">נושא:</span>
    <button class="ch-btn active" data-chapter="all">הכל</button>
    <button class="ch-btn" data-chapter="m16">נשק M16</button>
    <button class="ch-btn" data-chapter="med">מע"רים</button>
    <button class="ch-btn" data-chapter="bm">ב"מ</button>
    <button class="ch-btn" data-chapter="map">גאוגרפיה</button>
    <button class="ch-btn" data-chapter="gen">כללי</button>
  </div>
  <div class="bar-group">
    <span class="bar-label">מקראות:</span>
    <button class="ch-btn" data-chapter="mk_all">כל מקראות</button>
    <button class="ch-btn" data-chapter="mk1">שערים 1–3</button>
    <button class="ch-btn" data-chapter="mk4">שערים 4–5</button>
    <button class="ch-btn" data-chapter="mk6">שערים 6–7</button>
  </div>
</div>

<div id="stats-bar">
  <div class="stat">סה"כ <span id="stat-total" class="stat-num">0</span></div>
  <div class="stat">ענית <span id="stat-answered" class="stat-num">0</span></div>
  <div class="stat">נכון <span id="stat-correct" class="stat-num green">0</span></div>
  <div class="stat">שגוי <span id="stat-wrong" class="stat-num red">0</span></div>
</div>

<main>
  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    <div id="progress-label">0 / 0</div>
  </div>
  <div id="q-card">
    <div id="q-header">
      <span id="q-counter">שאלה 1</span>
      <span id="q-chapter-label">מקראות 1–3</span>
    </div>
    <div id="q-text">טוענת נתונים...</div>
    <div id="options-list"></div>
    <div id="feedback-box"></div>
    <div id="nav-row">
      <button class="nav-btn" id="btn-prev">→ הקודמת</button>
      <button class="nav-btn" id="btn-next">הבאה ←</button>
    </div>
  </div>
  <button id="btn-skip">דלג לשאלה שטרם ענית</button>
  <div id="result-screen">
    <div id="result-emoji"></div>
    <div id="result-title">סיימת!</div>
    <div id="result-score"></div>
    <div id="result-detail"></div>
    <button class="res-btn" id="btn-restart">התחל מחדש</button>
    <button class="res-btn" id="btn-retry">תרגל שגיאות</button>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
